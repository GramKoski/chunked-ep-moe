[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunked-ep-moe"
version = "0.1.0"
description = "Dropless, chunked expert-parallel MoE for JAX with ragged all-to-all and NVSHMEM transports"
requires-python = ">=3.11"
dependencies = ["jax>=0.11.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chunked_moe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
